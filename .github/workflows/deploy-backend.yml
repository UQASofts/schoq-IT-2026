name: Deploy Schoq Contact API

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t schoq-contact-api:latest -f server/Dockerfile server

      - name: Save Docker image
        run: |
          docker save schoq-contact-api:latest | gzip > backend-image.tar.gz

      - name: Upload Docker image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: backend-image.tar.gz
          target: /home/root/schoq/backend

      - name: Upload docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: server/docker-compose.yml
          target: /home/root/schoq/backend
          strip_components: 1

      - name: Generate .env from GitHub Secrets
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          {
            printf '%s\n' \
              "NODE_ENV=production" \
              "PORT=4003" \
              "SMTP_HOST=${SMTP_HOST}" \
              "SMTP_PORT=${SMTP_PORT}" \
              "SMTP_SECURE=${SMTP_SECURE}" \
              "SMTP_USER=${SMTP_USER}" \
              "SMTP_PASS=${SMTP_PASS}" \
              "MAIL_FROM=${MAIL_FROM}" \
              "MAIL_TO=${MAIL_TO}"
          } > deploy.env
          chmod 644 deploy.env

      - name: Upload generated .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy.env
          target: /home/root/schoq/backend

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /home/root/schoq/backend

            if [ -f deploy.env ]; then
              mv -f deploy.env .env
              chmod 600 .env
            fi

            if [ ! -f ".env" ]; then
              echo "Missing .env on server. Aborting deployment."
              exit 1
            fi

            echo "Loading Docker image..."
            docker load < backend-image.tar.gz
            rm -f backend-image.tar.gz

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Installing Docker Compose..."
              curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
              COMPOSE="docker-compose"
            fi

            echo "Stopping existing container if it is running..."
            $COMPOSE -p schoq-backend stop backend || true
            $COMPOSE -p schoq-backend rm -f backend || true
            docker rm -f schoq-contact-api || true

            echo "Starting container..."
            $COMPOSE -p schoq-backend up -d --force-recreate --no-deps backend

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Backend deployed"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /home/root/schoq/backend
            sleep 8

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            if $COMPOSE -p schoq-backend ps | grep -Eq "backend.*(Up|running)"; then
              echo "Container is running"
              if curl -fsS http://127.0.0.1:4003/health >/dev/null; then
                echo "Backend is responding"
              else
                echo "Container is up but /health is not responding"
                $COMPOSE -p schoq-backend logs backend --tail=50
                exit 1
              fi
            else
              echo "Container failed to start"
              $COMPOSE -p schoq-backend logs backend --tail=50
              exit 1
            fi
